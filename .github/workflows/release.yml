name: Release

on:
  push:
    tags:
      # This repository tags releases without a "v" prefix (1.0.0 ... 1.1.8).
      # The "v*" pattern alone therefore never fires. The called workflow
      # strips an optional leading "v" and requires a bare X.Y.Z afterwards,
      # so both spellings resolve to the same version.
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: nr-scheduler
      package-name: netresearch/nr-scheduler
      extension-key: nr_scheduler
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
