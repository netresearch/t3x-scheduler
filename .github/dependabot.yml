# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase-if-necessary
    # Block automatic TYPO3 framework major upgrades; the extension supports
    # ^13.4 || ^14.3 (see ext_emconf.php) and a new major needs a reviewed code
    # migration plus a passing test matrix, not a constraint bump. Renovate has
    # raised such unmigrated bumps before (PR #28 / PRs #34-36), so Dependabot
    # must also enforce this as a backstop.
    ignore:
      - dependency-name: "typo3/cms-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
